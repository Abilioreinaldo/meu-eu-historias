<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Eu Histórias — Protótipo</title>
<meta name="description" content="Protótipo navegável da Meu Eu Histórias: livros infantis personalizados onde a criança é a heroína.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mascote.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2A5A; --navy-2:#141D45; --star:#F9C23C; --star-d:#D9A01E; --coral-t:#B4472F;
  --cream:#FDF7EA; --line:#EFE4C8; --line-2:#E6D9B8; --soft:#F1E6CC; --sel:#FFF1CC;
  --ink-2:#3D4466; --ink-3:#4A5175; --muted:#D3D7EA;
  --display:'Baloo 2',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E9E1CC;font-family:var(--body);color:var(--navy);display:flex;justify-content:center;align-items:center;min-height:100%}
button{font-family:var(--body);color:inherit}
input,textarea{font-family:var(--body)}
input::placeholder,textarea::placeholder{color:#7A7F99}
a{color:var(--navy)}
.phone{width:390px;height:min(844px,100vh);background:var(--cream);display:flex;flex-direction:column;overflow:hidden;position:relative;border-radius:32px;box-shadow:0 30px 60px rgba(30,42,90,.25)}
@media (max-width:480px){body{display:block;background:var(--cream)}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{width:0;height:0}
.hdr{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.bar>div{height:8px;border-radius:4px;background:var(--star);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 10px;border-radius:12px;background:var(--navy);color:var(--cream);font-size:12px;font-weight:700}
.pad{padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;font-family:var(--display);font-weight:800;line-height:1.1}
h2{font-size:28px}
.lead{margin:0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border:2px solid var(--line);background:#fff;border-radius:18px;cursor:pointer;text-align:left;color:var(--navy)}
.opt.on{border-color:var(--navy);background:var(--sel)}
.opt-title{font-weight:800;font-size:15px;line-height:1.2}
.opt-desc{font-size:12px;line-height:1.35;color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-weight:800;font-size:14px}
.input{height:52px;border-radius:14px;border:2px solid var(--line-2);background:#fff;padding:0 14px;font-size:17px;color:var(--navy);outline:none}
.input:focus,textarea:focus{border-color:var(--navy)}
textarea.input{height:auto;min-height:92px;padding:12px 14px;font-size:15px;line-height:1.4;resize:none}
.check{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--navy);flex:none;background:#fff}
.on .check{background:var(--navy)}
.check svg{stroke:transparent}.on .check svg{stroke:var(--star)}
.ftr{padding:12px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.cta{height:56px;border:0;border-radius:18px;font-family:var(--display);font-weight:800;font-size:19px;cursor:pointer;background:var(--star);color:var(--navy);box-shadow:0 5px 0 var(--star-d)}
.cta[aria-disabled="true"]{background:#E9DFC6;color:#6B6F86;box-shadow:0 5px 0 #D6CBAE}
.hint{text-align:center;font-size:12px;font-weight:700;color:var(--coral-t);min-height:15px}
.card{padding:14px;border-radius:16px;background:#fff;border:2px solid var(--soft)}
.dark{background:var(--navy);color:var(--cream);border-radius:22px}
.step{display:flex;gap:12px;align-items:flex-start}
.num{width:34px;height:34px;border-radius:17px;background:var(--star);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.float{animation:float 4s ease-in-out infinite}
.secondary{height:44px;padding:0 18px;border-radius:14px;border:2px solid var(--navy);background:transparent;font-weight:800;font-size:14px;cursor:pointer}
.compare{position:relative;height:150px;border-radius:12px;overflow:hidden;display:flex;touch-action:none;user-select:none}
.compare .handle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff}
.compare .knob{position:absolute;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center}
.warn{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#FFE7DF;border:2px solid #F4B4A3}
.warn-btn{height:36px;padding:0 12px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}
</style>
</head>
<body>
<main class="phone" id="app" aria-live="polite"></main>

<script>
(() => {
  // ---------- Dados ----------
  const AGES = [
    { id: '0-2', label: '0 a 2 anos', desc: 'Frases curtas, letras grandes, muitas cores' },
    { id: '3-5', label: '3 a 5 anos', desc: 'Para ler junto na hora de dormir' },
    { id: '6-9', label: '6 a 9 anos', desc: 'Aventura com começo, meio e fim' },
    { id: '10', label: '10 anos ou mais', desc: 'Mais texto e enredo para ler sozinho' }
  ];
  const CATS = [
    ['todos', 'Todos'], ['aventura', 'Aventura'], ['familia', 'Família'], ['sentimentos', 'Sentimentos'],
    ['crescer', 'Crescer'], ['festas', 'Festas'], ['esportes', 'Esportes'], ['fe', 'Fé']
  ];
  const THEMES = [
    ['floresta', 'aventura', 'Floresta Encantada', 'Árvores mágicas e bichinhos falantes.', '#CFEBD6'],
    ['espaco', 'aventura', 'Viagem ao Espaço', 'Planetas, foguetes e estrelas amigas.', '#D7DCF5'],
    ['piratas', 'aventura', 'Ilha dos Piratas', 'Mapa do tesouro e muita coragem.', '#CDE8EE'],
    ['dinos', 'aventura', 'Vale dos Dinossauros', 'Uma expedição ao tempo dos gigantes.', '#E3EBC6'],
    ['irmao', 'familia', 'Vou Ganhar um Irmão', 'Preparando o coração para quem chega.', '#F2D9EC'],
    ['mudanca', 'familia', 'Casa Nova', 'Mudar de casa sem perder o que importa.', '#F6E2C8'],
    ['escuro', 'sentimentos', 'Amigo do Escuro', 'Para vencer o medo na hora de dormir.', '#D7DCF5'],
    ['confianca', 'sentimentos', 'Eu Consigo!', 'Para a criança que duvida de si.', '#FDE3B0'],
    ['chupeta', 'crescer', 'Tchau, Chupeta', 'Uma despedida cheia de carinho.', '#FBD5CC'],
    ['fralda', 'crescer', 'Adeus, Fralda', 'O grande passo, sem pressão.', '#CDE8EE'],
    ['escola', 'crescer', 'Primeiro Dia de Aula', 'Novos amigos e um lugar novo.', '#E3EBC6'],
    ['aniversario', 'festas', 'Meu Aniversário', 'A festa onde ele é a grande estrela.', '#FBD5CC'],
    ['natal', 'festas', 'Noite de Natal', 'Uma missão especial com o Papai Noel.', '#F6D2CD'],
    ['futebol', 'esportes', 'Craque da Final', 'O gol que decide o campeonato.', '#FDE3B0'],
    ['bale', 'esportes', 'Grande Apresentação', 'Dança, palco e frio na barriga.', '#F2D9EC'],
    ['arca', 'fe', 'A Arca de Noé', 'Uma viagem com todos os bichos.', '#CFEBD6']
  ].map(([id, cat, title, desc, tint]) => ({ id, cat, title, desc, tint }));
  const LESSONS = [
    ['coragem', 'Coragem', 'Agir mesmo com medo'], ['amizade', 'Amizade', 'Lealdade nos gestos pequenos'],
    ['partilha', 'Partilha', 'Dividir com quem ama'], ['persistencia', 'Persistência', 'Tentar de novo'],
    ['honestidade', 'Honestidade', 'Falar a verdade'], ['respeito', 'Respeito', 'Ouvir e tratar bem'],
    ['gentileza', 'Gentileza', 'Cuidar de quem está perto'], ['natureza', 'Cuidar do planeta', 'Plantas, bichos e o mundo']
  ].map(([id, label, desc]) => ({ id, label, desc }));
  const STYLES = [
    ['cartoon', 'Cartoon', '#8FC7F0', '#F9C23C'], ['aquarela', 'Aquarela', '#BFDCCB', '#F4A28E'],
    ['lapis', 'Lápis de cor', '#F2DDB6', '#7DA5D9'], ['classico', 'Livro clássico', '#D9C29A', '#8A5A3B'],
    ['manga', 'Mangá', '#E9E4F4', '#2F2F44'], ['massinha', 'Massinha', '#F7C6A5', '#5BB36E'],
    ['fofinho', 'Fofinho', '#F9D4E3', '#FFFFFF'], ['hq', 'Quadrinhos', '#FBD84A', '#E2533A']
  ].map(([id, label, swatch, dot]) => ({ id, label, swatch, dot }));
  const CAST = [['mae', 'Mãe'], ['pai', 'Pai'], ['irmao', 'Irmão ou irmã'], ['avos', 'Vô ou vó'], ['cao', 'Cachorro'], ['gato', 'Gato']];
  const OUTFITS = [
    ['tema', 'Roupa do tema', 'A Lumi veste a criança de acordo com a aventura'],
    ['foto', 'Manter a roupa da foto', 'Ideal para fantasia ou roupa de festa']
  ];
  const TIPS = ['Rosto de frente e nítido', 'Só a criança na foto', 'Boa luz, sem flash', 'Sem óculos escuros ou boné'];
  const PRICE = { pix: 44.9, card: 49.9, print: 129.9 };
  const EXTRAS = [
    { id: 'color', label: 'Versão para colorir', desc: 'As 14 ilustrações em traço, para pintar e imprimir', price: 9.9, tag: 'Sugestão da Lumi' },
    { id: 'audio', label: 'Narração em áudio', desc: 'A história lida em voz alta, com o nome da criança', price: 9.9 },
    { id: 'fast', label: 'Entrega prioritária', desc: 'Seu livro fura a fila e chega em até 30 minutos', price: 4.9 },
    { id: 'print', label: 'Livro impresso, capa dura', desc: 'Entregue em casa, além do PDF', price: 129.9 }
  ];

  // ---------- Estado ----------
  const initial = () => ({ step: 0, age: null, cat: 'todos', theme: null, lesson: null, style: null, name: '', gender: null,
    personality: '', face: false, body: false, outfit: 'tema', consent: false, warn: true, copied: false,
    cast: [], dedication: '', pay: 'pix', extras: [], split: 50 });
  let S = initial();
  const set = (patch) => { S = Object.assign({}, S, patch); render(); };
  let timer = null;
  const go = (step) => {
    set({ step });
    document.querySelector('.scroll')?.scrollTo(0, 0);
    if (step === 8) { clearTimeout(timer); timer = setTimeout(() => set({ step: 9 }), 2200); }
  };

  // ---------- Helpers ----------
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
  const ico = {
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    star: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>',
    tick: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    tickG: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F6B2A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
    face: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10.5" r=".8" fill="#1E2A5A"/><circle cx="15" cy="10.5" r=".8" fill="#1E2A5A"/><path d="M9 15c1.6 1.4 4.4 1.4 6 0"/></svg>',
    body: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 7.5v7M7 10.5h10M12 14.5l-3.5 6M12 14.5l3.5 6"/></svg>',
    warn: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A3A24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
    person: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4.5 20c1.3-3.6 4.2-5.5 7.5-5.5s6.2 1.9 7.5 5.5"/></svg>',
    arrows: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2A5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>'
  };

  // ---------- Regras por passo ----------
  function validate() {
    const nm = S.name.trim();
    switch (S.step) {
      case 1: return S.age ? '' : 'Escolha a idade';
      case 2: return S.theme ? '' : 'Escolha um tema';
      case 3: return S.lesson ? '' : 'Escolha a lição da história';
      case 4: return S.style ? '' : 'Escolha um estilo de desenho';
      case 5: return !nm ? 'Digite o nome' : (!S.gender ? 'Escolha menino ou menina' : '');
      case 6: return !S.face ? 'Envie a foto do rosto' : (!S.body ? 'Envie a foto de corpo inteiro' : (!S.consent ? 'Marque a autorização das fotos' : ''));
      default: return '';
    }
  }
  const total = () => (S.pay === 'pix' ? PRICE.pix : PRICE.card) + EXTRAS.filter((x) => S.extras.includes(x.id)).reduce((a, x) => a + x.price, 0);
  function ctaLabel() {
    if (S.step === 7) return 'Ver a capa grátis';
    if (S.step === 9) return 'Quero o livro completo';
    if (S.step === 10) return 'Pagar ' + brl(total());
    return 'Continuar';
  }
  const derived = () => {
    const theme = THEMES.find((t) => t.id === S.theme);
    const lesson = LESSONS.find((l) => l.id === S.lesson);
    const style = STYLES.find((x) => x.id === S.style);
    const age = AGES.find((a) => a.id === S.age);
    const nm = S.name.trim();
    const who = nm || 'seu filho';
    const castNames = S.cast.map((id) => CAST.find((c) => c[0] === id)[1].toLowerCase());
    return {
      theme, lesson, style, age, nm, who,
      coverTitle: theme ? (nm ? nm + ': ' : '') + theme.title : (nm || 'Seu herói'),
      castSummary: castNames.length ? who + ', ' + castNames.join(', ') : who + ' como protagonista'
    };
  };

  // ---------- Telas ----------
  const opt = (on, action, inner, style = '') => `<button class="opt${on ? ' on' : ''}" data-act="${action}" style="${style}" aria-pressed="${on}">${inner}</button>`;

  const screens = {
    0: () => `
      <div style="padding:14px 16px 0;display:flex;justify-content:center"><img src="assets/logo.webp" alt="Meu Eu Histórias" style="width:230px;height:auto"></div>
      <div style="padding:4px 24px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px">
        <h1 style="font-size:34px;line-height:1.05">A história onde seu filho é o herói.</h1>
        <p style="margin:0;font-size:16px;line-height:1.45;color:var(--ink-2)">Com o rostinho, o nome e o mundo favorito dele. Pronto no seu WhatsApp em até 2 horas.</p>
      </div>
      <div style="display:flex;justify-content:center;padding-top:6px"><img class="float" src="assets/mascote.webp" alt="Lumi, a estrelinha da Meu Eu, lendo um livro" style="width:220px;height:220px"></div>
      <div style="padding:0 20px;display:flex;flex-direction:column;gap:10px">
        <button class="cta" data-act="start" style="height:58px;font-size:20px;box-shadow:0 6px 0 var(--star-d)">Criar o livro do meu filho</button>
        <div style="text-align:center;font-size:13px;font-weight:700;color:var(--ink-3)">Leva 5 minutos · tenha 2 fotos da criança à mão</div>
      </div>
      <section class="dark" style="margin:26px 16px 0;padding:20px;display:flex;flex-direction:column;gap:16px">
        <h2 style="font-size:24px;color:var(--star)">Como funciona</h2>
        ${[['Monte a história', 'Tema, lição e estilo de desenho.'], ['Envie 2 fotos', 'A Lumi transforma a criança no personagem e mostra a capa antes de você pagar.'], ['Receba no WhatsApp', '30 páginas e 14 ilustrações em PDF, prontas para ler ou imprimir.']]
          .map(([t, d], i) => `<div class="step"><div class="num">${i + 1}</div><div><div style="font-weight:800;font-size:16px">${t}</div><div style="font-size:14px;color:var(--muted);line-height:1.4">${d}</div></div></div>`).join('')}
      </section>
      <section class="card" style="margin:16px 16px 0;padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center">
        <div style="font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-t)">Livro digital completo</div>
        <div style="font-family:var(--display);font-weight:800;font-size:44px;line-height:1">R$ 49,90</div>
        <div style="font-size:14px;color:var(--ink-2)">ou <strong>R$ 44,90 no Pix</strong></div>
        <div style="font-size:13px;color:var(--ink-3);line-height:1.4;margin-top:4px">Com certificado de Pequeno Leitor de brinde · garantia de 7 dias</div>
        <button data-act="start" style="margin-top:10px;width:100%;height:52px;border:0;border-radius:16px;background:var(--navy);color:var(--cream);font-weight:800;font-size:16px;cursor:pointer">Começar agora</button>
      </section>
      <div style="padding:22px 20px 30px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-3);text-align:center">
        <div>As fotos são usadas só para criar o personagem e apagadas depois da entrega.</div>
        <div><a href="#">Política de privacidade</a> · <a href="#">Termos</a></div>
      </div>`,

    1: () => `<div class="pad">
      <h2>Para qual idade é o livro?</h2>
      <p class="lead">A história, as palavras e o tamanho da letra se ajustam à idade.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${AGES.map((a) => opt(S.age === a.id, 'age:' + a.id, `<span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:800;font-size:17px">${a.label}</span><span class="opt-desc" style="font-size:13px">${a.desc}</span></span>${ico.next}`,
          'display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:10px 16px')).join('')}
      </div></div>`,

    2: () => `<div class="pad" style="gap:14px;padding-top:18px">
      <h2>Sobre o que é a história?</h2>
      <div class="hscroll" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
        ${CATS.map(([id, l]) => `<button data-act="cat:${id}" aria-pressed="${S.cat === id}" style="flex:none;height:40px;padding:0 14px;border-radius:20px;cursor:pointer;font-weight:800;font-size:13px;border:2px solid ${S.cat === id ? 'var(--navy)' : 'var(--line)'};background:${S.cat === id ? 'var(--navy)' : '#fff'};color:${S.cat === id ? 'var(--cream)' : 'var(--navy)'}">${l}</button>`).join('')}
      </div>
      <div class="grid2">
        ${THEMES.filter((t) => S.cat === 'todos' || t.cat === S.cat).map((t) => opt(S.theme === t.id, 'theme:' + t.id, `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
            <div style="width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:${t.tint}">${ico.star}</div>
            <span style="font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">${CATS.find((c) => c[0] === t.cat)[1]}</span>
          </div>
          <div class="opt-title">${t.title}</div><div class="opt-desc">${t.desc}</div>`,

    6: () => { const d = derived(); return `<div class="pad" style="padding-top:18px">

        <div style="display:flex;gap:8px"><button class="warn-btn" data-act="copy" style="border:0;background:#9A3A24;color:#fff">${S.copied ? 'Link copiado' : 'Copiar link'}</button>
        <button class="warn-btn" data-act="dismiss" style="border:2px solid #9A3A24;background:transparent;color:#9A3A24">Já estou no navegador</button></div></div></div>` : ''}
      <h2>Agora, as fotos de ${esc(d.who)}</h2>
      <p class="lead">Duas fotos recentes, com ${esc(d.who)} sozinho no enquadramento.</p>
      <div class="grid2">
        ${[['face', 'Foto do rosto', 'De frente, bem nítida', ico.face], ['body', 'Corpo inteiro', 'Da cabeça aos pés', ico.body]].map(([k, t, n, i]) => `
          <button class="opt${S[k] ? ' on' : ''}" data-act="photo:${k}" style="min-height:168px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border-style:dashed;border-color:${S[k] ? 'var(--navy)' : '#D9C99F'}">
            <div style="width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;background:${S[k] ? 'var(--star)' : 'var(--soft)'}">${i}</div>

      </div>
      ${S.face ? `<div class="dark" style="padding:12px;border-radius:16px;display:flex;flex-direction:column;gap:10px">
        <div style="font-size:13px;font-weight:800;color:var(--star)">Primeiro rascunho do personagem</div>
        <div class="compare" id="compare">
          <div style="width:${S.split}%;background:#CBB69A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#3A2D1C;overflow:hidden;white-space:nowrap">Foto real</div>
          <div style="flex:1;background:var(--star);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--navy);overflow:hidden;white-space:nowrap">Personagem</div>

      <div class="card" style="display:flex;flex-direction:column;gap:10px">

        <input type="checkbox" data-field="consent" ${S.consent ? 'checked' : ''} style="width:22px;height:22px;margin:0;accent-color:var(--navy);flex:none">
        <span>Sou o responsável legal e autorizo o uso das fotos só para criar este livro. Elas são apagadas depois da entrega (LGPD).</span>

    7: () => `<div class="pad">
      <h2>Quem mais entra na aventura?</h2>
      <p class="lead">Até 4 personagens. Cada um pode ter foto também. Pode pular.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${CAST.map(([id, l]) => { const on = S.cast.includes(id); return opt(on, 'cast:' + id, `
          <span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:800;font-size:16px">${l}</span><span class="opt-desc">${on ? 'Adicionado · foto opcional' : 'Toque para incluir'}</span></span>
          <span class="check">${ico.tick}</span>`, 'display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:8px 16px;border-radius:16px'); }).join('')}
      </div>
      <div class="field"><label for="f-ded">Dedicatória (opcional)</label>
        <input id="f-ded" class="input" type="text" style="font-size:16px" data-field="dedication" value="${esc(S.dedication)}" placeholder="Para o nosso herói, com amor..."></div>
      </div>`,

    8: () => { const d = derived(); return `<div style="flex:1;padding:40px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center">
      <div style="position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;inset:0;border-radius:100px;border:6px solid var(--soft);border-top-color:var(--star);animation:spin 1.1s linear infinite"></div>
        <img src="assets/mascote.webp" alt="" style="width:160px;height:160px;border-radius:80px;object-fit:cover">
      </div>
      <h2 style="font-size:26px">A Lumi está desenhando a capa de ${esc(d.who)}...</h2>
      <p class="lead" style="font-size:15px">Leva só alguns segundos.</p></div>`; },

    9: () => { const d = derived(); return `<div class="pad" style="align-items:center">
      <h2 style="align-self:stretch;font-size:26px">Olha só quem virou herói!</h2>
      <div style="position:relative;width:300px;height:380px;border-radius:10px 20px 20px 10px;background:var(--navy);overflow:hidden;box-shadow:0 18px 30px rgba(30,42,90,.28),inset 10px 0 0 var(--navy-2);display:flex;flex-direction:column;align-items:center;padding:26px 20px 18px 30px">
        ${[[30, 40, 4, 'var(--star)'], [70, 250, 6, 'var(--star)'], [150, 26, 3, 'var(--cream)'], [280, 260, 4, 'var(--cream)']].map(([t, l, s, c]) => `<div style="position:absolute;top:${t}px;left:${l}px;width:${s}px;height:${s}px;border-radius:50%;background:${c}"></div>`).join('')}
        <div style="font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--star);text-align:center">${esc(d.theme ? d.theme.title : 'Aventura')} · ${esc(d.lesson ? d.lesson.label : 'Coragem')}</div>
        <div style="margin-top:6px;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;text-align:center;color:var(--cream)">${esc(d.coverTitle)}</div>
        <div style="margin-top:16px;width:170px;height:170px;border-radius:85px;background:var(--star);border:5px solid var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          ${ico.person}<div style="font-size:12px;font-weight:800;text-align:center;padding:0 16px">${esc(d.who)} em estilo ${esc(d.style ? d.style.label.toLowerCase() : 'cartoon')}</div>
        </div>
        <div style="margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)"><img src="assets/mascote.webp" alt="" style="width:28px;height:28px;border-radius:14px"><span>Meu Eu Histórias</span></div>
        <div style="position:absolute;top:160px;left:-20px;right:-20px;transform:rotate(-24deg);text-align:center;font-family:var(--display);font-weight:800;font-size:48px;color:rgba(253,247,234,.18);letter-spacing:.1em">PRÉVIA</div>
      </div>
      <div class="card" style="align-self:stretch;font-size:14px;line-height:1.45;color:var(--ink-2)"><strong style="color:var(--navy)">No livro completo:</strong> 30 páginas, 14 ilustrações com ${esc(d.castSummary)}.</div>
      <button class="secondary" data-act="redo">Não ficou parecido? Trocar foto</button></div>`; },

    10: () => { const d = derived(); return `<div class="pad">
      <h2>Falta pouco!</h2>
      <div class="card" style="display:flex;gap:12px;align-items:center">
        <div style="width:54px;height:68px;border-radius:4px 8px 8px 4px;background:var(--navy);flex:none;display:flex;align-items:center;justify-content:center"><div style="width:26px;height:26px;border-radius:13px;background:var(--star)"></div></div>
        <div style="display:flex;flex-direction:column;gap:2px"><div style="font-weight:800;font-size:15px">${esc(d.coverTitle)}</div>
        <div style="font-size:13px;color:var(--ink-3)">${esc(d.lesson ? d.lesson.label : '')} · ${esc(d.style ? d.style.label : '')} · PDF 30 páginas</div></div>
      </div>
      <div class="field"><div class="label">Pagamento</div>
        ${[['pix', 'Pix', 'Aprovação na hora · 10% off', PRICE.pix], ['card', 'Cartão de crédito', 'Até 12x', PRICE.card]].map(([id, l, n, p]) => opt(S.pay === id, 'pay:' + id,
          `<span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:800;font-size:16px">${l}</span><span class="opt-desc">${n}</span></span><span style="font-weight:800;font-size:16px">${brl(p)}</span>`,
          'display:flex;align-items:center;justify-content:space-between;min-height:60px;padding:10px 16px;border-radius:16px')).join('')}
      </div>
      <div class="field"><div class="label">Deixe ainda mais especial</div>
        ${EXTRAS.map((x) => opt(S.extras.includes(x.id), 'extra:' + x.id, `<span class="check">${ico.tick}</span>
          <span style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-weight:800;font-size:15px">${x.label}</span>${x.tag ? `<span style="padding:2px 8px;border-radius:10px;background:var(--star);font-size:11px;font-weight:800">${x.tag}</span>` : ''}</span>
            <span class="opt-desc" style="font-size:13px">${x.desc}</span></span>
          <span style="font-weight:800;font-size:14px;white-space:nowrap">+ ${brl(x.price)}</span>`,
          'display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px')).join('')}
      </div>
      <div class="card" style="display:flex;gap:10px;align-items:center;background:#EEF6EC;border-color:#CFE6CA">
        <span style="width:32px;height:32px;border-radius:16px;background:#DCEFD9;display:flex;align-items:center;justify-content:center;flex:none">${ico.tickG}</span>
        <span style="font-size:13px;line-height:1.4;color:#1F4D26"><strong>Brinde:</strong> certificado de Pequeno Leitor com o nome de ${esc(d.who)}.</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0"><span style="font-weight:800;font-size:16px">Total</span>
        <span style="font-family:var(--display);font-weight:800;font-size:30px">${brl(total())}</span></div>
      <div style="font-size:12px;color:var(--ink-3);text-align:center;line-height:1.4">Garantia de 7 dias: se não gostar, devolvemos o valor.</div>
      </div>`; },

    11: () => { const d = derived(); return `<div style="flex:1;padding:36px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
      <img class="float" src="assets/mascote.webp" alt="" style="width:190px;height:190px">
      <h2 style="font-size:30px">Pedido confirmado!</h2>
      <p style="margin:0;font-size:16px;line-height:1.45;color:var(--ink-2)">A Lumi já está escrevendo a história de ${esc(d.who)}. Você recebe o livro no WhatsApp e no e-mail em até ${S.extras.includes('fast') ? '30 minutos' : '2 horas'}${S.extras.includes('audio') ? ', com a narração em áudio' : ''}${S.extras.includes('color') ? ' e a versão para colorir' : ''}.</p>
      <div class="dark" style="align-self:stretch;padding:14px;border-radius:16px;font-size:14px;line-height:1.45;text-align:left"><strong style="color:var(--star)">Dica:</strong> leia junto na hora de dormir e deixe ${esc(d.who)} descobrir sozinho que é o herói.</div>
      <button class="secondary" data-act="restart" style="height:52px;padding:0 24px;border-radius:16px;font-size:15px">Criar outro livro</button></div>`; }
  };

  // ---------- Render ----------
  const app = document.getElementById('app');
  function header() {
    const n = Math.min(S.step, 8);
    const d = derived();
    const chips = [d.age && d.age.label, d.theme && d.theme.title, d.lesson && d.lesson.label, d.style && d.style.label].filter(Boolean);
    return `<header class="hdr"><div class="hdr-row">
      <button class="icon-btn" data-act="back" aria-label="Voltar">${ico.back}</button>
      <img src="assets/logo.webp" alt="Meu Eu Histórias" style="height:40px;width:auto">
      <div style="width:44px;font-size:13px;font-weight:800;text-align:right;color:var(--ink-3)">${n}/8</div></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${n}"><div style="width:${n * 12.5}%"></div></div>
      ${chips.length && S.step >= 2 && S.step <= 5 ? `<div class="chips">${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}
      </header>`;
  }
  function footer() {
    const err = validate();
    return `<footer class="ftr"><button class="cta" data-act="next" aria-disabled="${!!err}">${ctaLabel()}</button><div class="hint" id="hint">${err}</div></footer>`;
  }
  function render() {
    const focused = document.activeElement && document.activeElement.id;
    const sel = focused && document.activeElement.selectionStart;
    const scrollTop = document.querySelector('.scroll')?.scrollTop || 0;
    const wizard = S.step >= 1 && S.step <= 10 && S.step !== 8;
    app.innerHTML = (wizard ? header() : '') + `<div class="scroll">${screens[S.step]()}</div>` + (wizard ? footer() : '');
    const sc = document.querySelector('.scroll'); if (sc) sc.scrollTop = scrollTop;
    if (focused) { const el = document.getElementById(focused); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} } }
    bindCompare();
  }

  // ---------- Eventos ----------
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const [act, val] = b.dataset.act.split(':');
    switch (act) {
      case 'start': go(1); break;
      case 'back': go(S.step === 9 ? 7 : S.step - 1); break;
      case 'next': if (!validate()) go(S.step + 1); break;
      case 'restart': S = initial(); go(0); break;
      case 'redo': go(6); break;
      case 'age': S.age = val; go(2); break;
      case 'cat': set({ cat: val }); break;
      case 'theme': set({ theme: val }); break;
      case 'lesson': set({ lesson: val }); break;
      case 'style': set({ style: val }); break;
      case 'gender': set({ gender: val }); break;
      case 'outfit': set({ outfit: val }); break;
      case 'pay': set({ pay: val }); break;
      case 'extra': set({ extras: S.extras.includes(val) ? S.extras.filter((x) => x !== val) : S.extras.concat(val) }); break;
      case 'photo': set({ [val]: !S[val] }); break;
      case 'dismiss': set({ warn: false }); break;
      case 'copy':
        try { navigator.clipboard && navigator.clipboard.writeText(location.href); } catch (err) {}
        set({ copied: true }); setTimeout(() => set({ copied: false }), 1800); break;
      case 'cast': {
        const on = S.cast.includes(val);
        if (on) set({ cast: S.cast.filter((x) => x !== val) });
        else if (S.cast.length < 4) set({ cast: S.cast.concat(val) });
        break;
      }
    }
  });
  // Campos de texto: atualiza o estado sem redesenhar a tela (mantém o teclado aberto)
  app.addEventListener('input', (e) => {
    const f = e.target.dataset.field; if (!f || f === 'consent') return;
    S[f] = e.target.value;
    const err = validate();
    const cta = app.querySelector('.cta[data-act="next"]'); if (cta) cta.setAttribute('aria-disabled', !!err);
    const h = document.getElementById('hint'); if (h) h.textContent = err;
  });
  app.addEventListener('change', (e) => { if (e.target.dataset.field === 'consent') set({ consent: e.target.checked }); });

  // Comparador foto × personagem (arrastável)
  function bindCompare() {
    const c = document.getElementById('compare'); if (!c) return;
    const move = (x) => {
      const r = c.getBoundingClientRect();
      const p = Math.max(5, Math.min(95, ((x - r.left) / r.width) * 100));
      S.split = p;
      c.children[0].style.width = p + '%'; c.children[2].style.left = p + '%'; c.children[3].style.left = p + '%';
    };
    c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); move(e.clientX); });
    c.addEventListener('pointermove', (e) => { if (c.hasPointerCapture(e.pointerId)) move(e.clientX); });
  }

  render();
})();
</script>
